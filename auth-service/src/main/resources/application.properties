# ==========================================
# Core Application Configuration
# ==========================================
spring.application.name=AUTH-SERVICE
server.port=8081

# ==========================================
# Database Connection Settings
# ==========================================
# ? FIXED: Changed hardcoded localhost to support Docker overlay networks
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authService}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:434680}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================
# JWT Configuration
# ==========================================
jwt.secret=${JWT_SECRET:mySuperSecureSecretKeyThatIsAtLeast32Characters12345}
jwt.access-expiration=604800000
jwt.refresh-expiration=604800000

# ==========================================
# Google OAuth2 Client Configuration
# ==========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:1061371119171-oa1cfiid073p1vectk6t1vs6m3cm8v3b.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:change-me}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
# ? FIXED: Redirect URI must target the external gateway proxy url (port 8080) for production OAuth lifecycle callbacks to route back inside Docker
spring.security.oauth2.client.registration.google.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

# ==========================================
# Third-Party Communication Integrations
# ==========================================
resend.api-key=${RESEND_API_KEY:change-me}
resend.from-email=${RESEND_FROM_EMAIL:PrevYearPaper App <noreply@pdeep.store>}

twilio.account_sid=${TWILIO_ACCOUNT_SID:change-me}
twilio.auth_token=${TWILIO_AUTH_TOKEN:change-me}
twilio.phone_number=${TWILIO_PHONE_NUMBER:+15005550006}
twilio.verify_service_sid=${TWILIO_VERIFY_SERVICE_SID:change-me}

# ==========================================
# Service Registry Configuration (Eureka)
# ==========================================
# ? FIXED: Parametrizes discovery routing endpoints across container boundaries
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# ==========================================
# Distributed Tracing & Observability (Zipkin)
# ==========================================
management.tracing.sampling.probability=1.0
# ? FIXED: Dynamically shifts span exports to the shared zipkin engine container
management.zipkin.tracing.endpoint=${SPRING_ZIPKIN_BASE_URL:http://localhost:9411}/api/v2/spans

# ==========================================
# Distributed Messaging Cluster (Kafka)
# ==========================================
# ? FIXED: Clean structured resolution tag for relaxed property mapping checks
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

feign.client.config.university-service.url=http://localhost:8082

#UNIVERSITY_SERVICE_URL: ${UNIVERSITY_SERVICE_URL:http://localhost:8082}
UNIVERSITY_SERVICE_URL=http://localhost:8082

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000


spring.kafka.properties.security.protocol=SASL_SSL

spring.kafka.properties.sasl.mechanism=PLAIN

spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";

spring.kafka.properties.ssl.endpoint.identification.algorithm=https
