spring:
  cloud:
    loadbalancer:
      clients:
        UNIVERSITY-SERVICE:
          - uri: http://university-service:8082
        AUTH-SERVICE:
          - uri: http://auth-service:8081
        NOTIFICATION-SERVICE:
          - uri: http://notification-service:8085
        USER-SERVICE:
          - uri: http://user-service:8086
        CONTENT-SERVICE:
          - uri: http://content-service:8090

feign:
  client:
    config:
      AUTH-SERVICE:
        url: http://auth-service:8081

# 🟢 Rate Limiting Configuration (Docker)
rate-limiting:
  enabled: true
  ip:
    default:
      limit: 100
      window-seconds: 60
    auth:
      limit: 10
      window-seconds: 60
    upload:
      limit: 20
      window-seconds: 60
  user:
    default:
      limit: 1000
      window-seconds: 60
    auth:
      limit: 50
      window-seconds: 60
    upload:
      limit: 100
      window-seconds: 60
