server:
  port: 8080

spring:
  application:
    name: API-GATEWAY

  # KEEP THIS for AuthClient and internal logic
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
  cloud:
    gateway:
      httpclient:
        connect-timeout: 10000
        response-timeout: 60s

# 🟢 Rate Limiting Configuration (Production)
rate-limiting:
  enabled: true
  ip:
    default:
      limit: 100
      window-seconds: 60
    auth:
      limit: 10
      window-seconds: 60
    upload:
      limit: 20
      window-seconds: 60
  user:
    default:
      limit: 1000
      window-seconds: 60
    auth:
      limit: 50
      window-seconds: 60
    upload:
      limit: 100
      window-seconds: 60

management:
  tracing:
    sampling:
      probability: 1.0