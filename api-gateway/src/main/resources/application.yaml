server:
  port: 8080
  # Trust X-Forwarded-* headers from the nginx-proxy so the app generates
  # correct https:// URLs (OAuth redirects, links, CORS) behind TLS.
  forward-headers-strategy: framework

spring:
  application:
    name: API-GATEWAY

  # KEEP THIS for AuthClient and internal logic
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
  cloud:
    gateway:
      httpclient:
        connect-timeout: 10000
        response-timeout: 60s

# eureka:
#   client:
#     service-url:
#       defaultZone: http://localhost:8769/eureka/

# 🟢 Strict Per-Route Rate Limiting Configuration
# Uses atomic Redis INCR for distributed-safe counting.
# First matching route pattern wins; order matters.
rate-limiting:
  enabled: true
  routes:
    # 🚨 AUTH ROUTES - Very strict to prevent brute-force and abuse
    "/api/v1/auth/register":
      ip-limit: 5
      ip-window: 3600
      user-limit: 10
      user-window: 3600
    "/api/v1/auth/login":
      ip-limit: 10
      ip-window: 3600
      user-limit: 20
      user-window: 3600
    "/api/v1/auth/refresh":
      ip-limit: 30
      ip-window: 3600
      user-limit: 100
      user-window: 3600
    "/api/v1/auth/verify-otp":
      ip-limit: 10
      ip-window: 3600
      user-limit: 20
      user-window: 3600
    "/api/v1/auth/resend-otp":
      ip-limit: 5
      ip-window: 3600
      user-limit: 10
      user-window: 3600
    "/api/v1/auth/forgot-password":
      ip-limit: 5
      ip-window: 3600
      user-limit: 10
      user-window: 3600
    "/api/v1/auth/reset-password":
      ip-limit: 5
      ip-window: 3600
      user-limit: 10
      user-window: 3600

    # 📤 UPLOAD ROUTES - Moderate limits to prevent abuse
    "/api/v1/upload/**":
      ip-limit: 50
      ip-window: 3600
      user-limit: 100
      user-window: 3600

    # 📄 CONTENT ROUTES - Higher limits for browsing
    "/api/v1/content/**":
      ip-limit: 100
      ip-window: 3600
      user-limit: 500
      user-window: 3600

    # 👤 USER ROUTES - Higher limits for profile management
    "/api/v1/users/**":
      ip-limit: 100
      ip-window: 3600
      user-limit: 500
      user-window: 3600

    # 🏫 UNIVERSITY ROUTES - Higher limits for public data
    "/api/v1/universities/**":
      ip-limit: 100
      ip-window: 3600
      user-limit: 500
      user-window: 3600

    # 🌍 PUBLIC READ ROUTES - Generous but not unlimited
    "/api/v1/get/**":
      ip-limit: 300
      ip-window: 60
      user-limit: 1000
      user-window: 60

  # Default fallback for any unmatched routes
  default:
    ip-limit: 200
    ip-window: 60
    user-limit: 1000
    user-window: 60

management:
  tracing:
    sampling:
      probability: 1.0
