server:
  port: 8080
  # Trust X-Forwarded-* headers from the nginx-proxy so the app generates
  # correct https:// URLs (OAuth redirects, links, CORS) behind TLS.
  forward-headers-strategy: framework

spring:
  application:
    name: API-GATEWAY

  # KEEP THIS for AuthClient and internal logic
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
  cloud:
    gateway:
      httpclient:
        connect-timeout: 10000
        response-timeout: 60s

# eureka:
#   client:
#     service-url:
#       defaultZone: http://localhost:8761/eureka/

# 🟢 Rate Limiting Configuration
rate-limiting:
  enabled: true
  # IP-based limits (applied to all requests)
  ip:
    default:
      limit: 100
      window-seconds: 60
    auth:
      limit: 10
      window-seconds: 60
    upload:
      limit: 20
      window-seconds: 60
  # User-based limits (applied only to authenticated requests)
  user:
    default:
      limit: 1000
      window-seconds: 60
    auth:
      limit: 50
      window-seconds: 60
    upload:
      limit: 100
      window-seconds: 60

management:
  tracing:
    sampling:
      probability: 1.0