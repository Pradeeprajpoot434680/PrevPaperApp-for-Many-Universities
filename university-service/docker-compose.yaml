services:
  university-service:
    image: ${DOCKER_USERNAME}/prevpaper-university-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_URL: ${MYSQL_URL}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
      SPRING_DATA_REDIS_USERNAME: ${REDIS_USERNAME}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_DATA_REDIS_SSL_ENABLED: ${REDIS_SSL}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP}
      SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL}
      SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM}
      SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: ${KAFKA_SASL_JAAS_CONFIG}
      SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_LOCATION: /app/certs/kafka-truststore.jks
      SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_PASSWORD: changeit
      SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_TYPE: JKS
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      CONTENT_SERVICE_URL: ${CONTENT_SERVICE_URL}
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: ${ZIPKIN_ENDPOINT}
      EUREKA_CLIENT_ENABLED: "false"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
