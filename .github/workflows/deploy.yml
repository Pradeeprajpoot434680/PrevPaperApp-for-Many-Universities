name: Deploy PrevPaper microservices

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            common:
              - 'pom.xml'
              - 'common-lib/**'
              - '.github/workflows/deploy.yml'
            api-gateway:
              - 'api-gateway/**'
            auth-service:
              - 'auth-service/**'
            user-service:
              - 'user-service/**'
            content-service:
              - 'content-service/**'
            university-service:
              - 'university-service/**'
            notification-service:
              - 'notificationService/**'
            upload-service:
              - 'upload-service/**'

  build-and-push:
    needs: [changes]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: api-gateway, dockerfile: api-gateway/Dockerfile }
          - { name: auth-service, dockerfile: auth-service/Dockerfile }
          - { name: user-service, dockerfile: user-service/Dockerfile }
          - { name: content-service, dockerfile: content-service/Dockerfile }
          - { name: university-service, dockerfile: university-service/Dockerfile }
          - { name: notification-service, dockerfile: notificationService/Dockerfile }
          - { name: upload-service, dockerfile: upload-service/Dockerfile }
    steps:
      - uses: actions/checkout@v4
        if: contains(needs.changes.outputs.services, matrix.service.name) || contains(needs.changes.outputs.services, 'common')
      - uses: docker/setup-buildx-action@v3
        if: contains(needs.changes.outputs.services, matrix.service.name) || contains(needs.changes.outputs.services, 'common')
      - uses: docker/login-action@v3
        if: contains(needs.changes.outputs.services, matrix.service.name) || contains(needs.changes.outputs.services, 'common')
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push immutable image
        if: contains(needs.changes.outputs.services, matrix.service.name) || contains(needs.changes.outputs.services, 'common')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/prevpaper-${{ matrix.service.name }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/prevpaper-${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [changes, build-and-push]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: api-gateway, directory: api-gateway, host_secret: API_GATEWAY_VM_HOST, env_file: vm1.env }
          - { name: auth-service, directory: auth-service, host_secret: AUTH_SERVICE_VM_HOST, env_file: vm2.env }
          - { name: user-service, directory: user-service, host_secret: USER_SERVICE_VM_HOST, env_file: vm2.env }
          - { name: content-service, directory: content-service, host_secret: CONTENT_SERVICE_VM_HOST, env_file: vm4.env }
          - { name: university-service, directory: university-service, host_secret: UNIVERSITY_SERVICE_VM_HOST, env_file: vm3.env }
          - { name: notification-service, directory: notificationService, host_secret: NOTIFICATION_SERVICE_VM_HOST, env_file: vm3.env }
          - { name: upload-service, directory: upload-service, host_secret: UPLOAD_SERVICE_VM_HOST, env_file: vm4.env }
    steps:
      - uses: actions/checkout@v4
        if: contains(needs.changes.outputs.services, matrix.service.name) || contains(needs.changes.outputs.services, 'common')

      # Uses the runner's built-in OpenSSH client instead of appleboy/ssh-action,
      # which downloads a drone-ssh binary from GitHub Releases at runtime and kept
      # failing with HTTP 503 / "Connection died" (GitHub release download outage).
      - name: Set up SSH key
        if: contains(needs.changes.outputs.services, matrix.service.name) || contains(needs.changes.outputs.services, 'common')
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          # tr -d '\r' guards against Windows-pasted secrets (CRLF breaks OpenSSH key parsing)
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$HOME/.ssh/vm_key"
          chmod 600 "$HOME/.ssh/vm_key"

      - name: Create deployment directory
        if: contains(needs.changes.outputs.services, matrix.service.name) || contains(needs.changes.outputs.services, 'common')
        env:
          SSH_HOST: ${{ secrets[matrix.service.host_secret] }}
          SSH_USER: ${{ secrets.VM_USERNAME }}
          SERVICE_NAME: ${{ matrix.service.name }}
        run: |
          set -eu
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
              -i "$HOME/.ssh/vm_key" \
              "$SSH_USER@$SSH_HOST" \
              "mkdir -p \"\$HOME/prevpaper/$SERVICE_NAME\""

      - name: Upload Compose file
        if: contains(needs.changes.outputs.services, matrix.service.name) || contains(needs.changes.outputs.services, 'common')
        env:
          SSH_HOST: ${{ secrets[matrix.service.host_secret] }}
          SSH_USER: ${{ secrets.VM_USERNAME }}
          SERVICE_NAME: ${{ matrix.service.name }}
        run: |
          set -eu
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
              -i "$HOME/.ssh/vm_key" \
              "${{ matrix.service.directory }}/docker-compose.yaml" \
              "$SSH_USER@$SSH_HOST:/home/$SSH_USER/prevpaper/$SERVICE_NAME/"

      - name: Pull and start service
        if: contains(needs.changes.outputs.services, matrix.service.name) || contains(needs.changes.outputs.services, 'common')
        env:
          SSH_HOST: ${{ secrets[matrix.service.host_secret] }}
          SSH_USER: ${{ secrets.VM_USERNAME }}
          SERVICE_NAME: ${{ matrix.service.name }}
          ENV_FILE: ${{ matrix.service.env_file }}
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -eu
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
              -i "$HOME/.ssh/vm_key" \
              "$SSH_USER@$SSH_HOST" \
              "SERVICE_NAME='$SERVICE_NAME' ENV_FILE='$ENV_FILE' \
               DOCKER_USERNAME='$DOCKER_USERNAME' \
               DOCKERHUB_TOKEN='$DOCKERHUB_TOKEN' \
               IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE_EOF'
          set -eu
          cd "$HOME/prevpaper/$SERVICE_NAME"
          ENV_PATH="$HOME/prevpaper/$ENV_FILE"
          if [ ! -r "$ENV_PATH" ]; then
            echo "Required VM environment file is missing or unreadable: $ENV_PATH" >&2
            exit 1
          fi
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKER_USERNAME" --password-stdin
          IMAGE_TAG="$IMAGE_TAG" docker compose --env-file "$ENV_PATH" -f docker-compose.yaml config -q
          IMAGE_TAG="$IMAGE_TAG" docker compose --env-file "$ENV_PATH" -f docker-compose.yaml pull
          IMAGE_TAG="$IMAGE_TAG" docker compose --env-file "$ENV_PATH" -f docker-compose.yaml up -d --remove-orphans
          IMAGE_TAG="$IMAGE_TAG" docker compose --env-file "$ENV_PATH" -f docker-compose.yaml ps

          # =========================================================================
          # DISK SPACE CLEANUP
          # =========================================================================
          # When the new container runs, the old image loses its ":latest" tag and
          # becomes untagged ("dangling"). Running 'docker image prune -f' removes
          # these old images immediately, preventing the VMs from ever running out
          # of disk space over time.
          # =========================================================================
          echo "Starting post-deployment disk cleanup..."
          docker image prune -f
          REMOTE_EOF
