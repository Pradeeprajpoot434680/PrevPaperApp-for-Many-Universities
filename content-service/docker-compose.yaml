services:
  clamav:
    image: clamav/clamav:latest
    restart: unless-stopped
    expose:
      - "3310"
    volumes:
      # Persistent virus DB so the container can be recreated without re-downloading ~500MB
      - clamav_data:/var/lib/clamav
    healthcheck:
      # Real ping to clamd - "clamdscan --version" reported healthy even when clamd was dead.
      # ClamAV 1.5 requires an argument for --ping (plain --ping errors with exit 2).
      test: ["CMD-SHELL", "clamdscan --ping=5"]
      interval: 30s
      timeout: 10s
      retries: 5
      # First start downloads the virus DB (can take 10+ min on a fresh environment)
      start_period: 900s

  content-service:
    image: ${DOCKER_USERNAME}/prevpaper-content-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: "8090"
      SPRING_DATASOURCE_URL: ${POSTGRES_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP}
      SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL}
      SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM}
      SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: ${KAFKA_SASL_JAAS_CONFIG}
      SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_LOCATION: /app/certs/kafka-truststore.jks
      SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_PASSWORD: changeit
      SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_TYPE: JKS
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      UNIVERSITY_SERVICE_URL: ${UNIVERSITY_SERVICE_URL}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: ${ZIPKIN_ENDPOINT}
      EUREKA_CLIENT_ENABLED: "false"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    depends_on:
      clamav:
        condition: service_healthy

volumes:
  clamav_data:
