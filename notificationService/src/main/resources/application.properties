server.port=8085
spring.application.name=NOTIFICATION-SERVICE

# ==========================================
# Database Connection Settings (Fixed Fallbacks)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notificationService}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:434680}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# Resend API Key Target Sync
# ==========================================
resend.api-key=${RESEND_API_KEY:change-me}
resend.api.key=${RESEND_API_KEY:change-me}
resend.from-email=${RESEND_FROM_EMAIL:noreply@pdeep.store}
resend.email.from=${RESEND_FROM_EMAIL:noreply@pdeep.store}

# ==========================================
# Twilio Communication Properties
# ==========================================
twilio.account_sid=${TWILIO_ACCOUNT_SID:change-me}
twilio.auth_token=${TWILIO_AUTH_TOKEN:change-me}
twilio.phone_number=${TWILIO_PHONE_NUMBER:+15005550006}
twilio.verify_service_sid=${TWILIO_VERIFY_SERVICE_SID:change-me}

# ==========================================
# Discovery Engine Control (Eureka Bypass Flagged)
# ==========================================
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:false}
eureka.client.register-with-eureka=${EUREKA_CLIENT_REGISTER_WITH_EUREKA:false}
eureka.client.fetch-registry=${EUREKA_CLIENT_FETCH_REGISTRY:false}

# ==========================================
# Kafka Cluster Configuration
# ==========================================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.prevpaper.comman.dto
spring.kafka.consumer.properties.spring.json.value.default.type=com.prevpaper.comman.dto.CommonNotificationRequest

# ==========================================
# Observability Tracing Pipeline
# ==========================================
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
management.zipkin.tracing.endpoint=${SPRING_ZIPKIN_BASE_URL:http://localhost:9411}/api/v2/spans
spring.kafka.listener.observation-enabled=true
management.endpoints.web.exposure.include=health,info,metrics,tracing

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000